[package]
name = "aero_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Trustless Ethereum + ERC20 wallet core for the Aero desktop wallet (Feather fork). Keys, signing, ERC20, encrypted keystore and a Tor-routed RPC/light-client provider, exposed over a C ABI."
license = "BSD-3-Clause"

# Produces:
#  - a C-callable static/shared library (consumed by the Qt/C++ frontend via the C ABI in `ffi.rs`)
#  - an rlib (so the `cli` example and unit tests can link against it)
[lib]
name = "aero_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Enables the Helios trustless light-client integration in `helios_rt.rs`.
#
# Helios is intentionally NOT a hard dependency: its current git pin drags in the full OP-Stack
# libp2p tree (which today references a yanked crate), so forcing it would break resolution for
# everyone. To use it, add the two deps below to `[dependencies]` and build with
# `--features helios`:
#     helios = { git = "https://github.com/a16z/helios", package = "helios" }
#     eyre   = "0.6"
# Without the feature, the wallet still routes JSON-RPC over Tor to user-configured endpoints;
# with it, reads are additionally verified against the consensus light-client proofs.
helios = []

[dependencies]
# --- Ethereum primitives, keys, signing, ABI, provider ---
alloy = { version = "1.0", default-features = false, features = [
    "std",
    "consensus",
    "network",
    "rpc-types",
    "rpc-types-eth",
    "contract",
    "sol-types",
    "json",
    "signers",
    "signer-local",
    "signer-mnemonic",
    "provider-http",
    "reqwest",
    "reqwest-rustls-tls",
] }

# --- BIP39 mnemonic generation / validation (rust-bitcoin) ---
bip39 = { version = "2", features = ["rand"] }

# --- Hardware wallets (USB) ---
# Ledger: alloy's signer over the native HID transport (coins-ledger). Trezor: the raw protocol
# client (rusb/libusb transport), used directly so we can inject a host-entered passphrase
# (Trezor Suite style), which alloy-signer-trezor does not support.
alloy-signer-ledger = "2"
trezor-client = { version = "0.1.5", default-features = false, features = ["ethereum"] }

# --- Encrypted keystore ---
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }

# --- HTTP client with SOCKS (Tor) support, shared with alloy transport ---
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "socks",
    "json",
] }

# --- async runtime for the FFI blocking bridge ---
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
futures = "0.3"

# --- serde / json for FFI payloads ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- misc ---
thiserror = "2"
once_cell = "1"
hex = "0.4"
tracing = "0.1"

# --- optional trustless light client (see the `helios` feature note above) ---
# helios = { git = "https://github.com/a16z/helios", package = "helios" }
# eyre   = "0.6"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[[example]]
name = "cli"
path = "examples/cli.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
