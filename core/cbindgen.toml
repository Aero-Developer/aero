language = "C"
header = "/* aero_core C ABI — generated by cbindgen. Do not edit by hand. */"
include_guard = "AERO_CORE_H"
autogen_warning = "/* Warning: this file is auto-generated. */"
pragma_once = true
cpp_compat = true
tab_width = 4
style = "type"

[export]
prefix = "Aero"
include = ["Wallet"]

[parse]
parse_deps = false

[fn]
args = "vertical"

[enum]
prefix_with_name = true
